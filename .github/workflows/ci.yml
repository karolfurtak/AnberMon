name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lint deps
        run: pip install ruff

      - name: AST parse
        run: python -c "import ast; ast.parse(open('app/main.py', encoding='utf-8').read()); print('main.py syntax OK')"

      - name: Ruff lint
        # ignoruj reguły stylistyczne — sprawdzamy tylko prawdziwe bugi (F-syntax, E9-runtime)
        run: ruff check app/ --select=E9,F --ignore=F401,F541,F841

      - name: Validate struct (mock SDL2 + evdev)
        run: |
          pip install Pillow psutil
          python -c "
          src = open('app/main.py', encoding='utf-8').read()
          assert 'class Monitor' in src, 'klasa Monitor wymagana'
          assert 'def render' in src and 'def run' in src, 'metody render/run wymagane'
          assert 'fb0/blank' in src, 'POWER toggle przez fb0/blank wymagany'
          assert 'MENU_KEY' in src or 'EXIT_KEYS' in src, 'MENU exit wymagany'
          print('struct OK')
          "

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck launcher
        run: shellcheck --severity=error app/AnberMon.sh

      - name: Shellcheck installer
        run: shellcheck --severity=error scripts/install.sh

      - name: Bash syntax test
        run: |
          bash -n app/AnberMon.sh
          bash -n scripts/install.sh
